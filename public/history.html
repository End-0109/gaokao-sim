<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>历年录取 — 陕西省高考志愿模拟填报系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Microsoft YaHei","微软雅黑","Segoe UI",sans-serif; background:#eef2f6; min-height:100vh; font-size:14px; color:#333; }
.top-bar { background: linear-gradient(135deg,#1a3a6b,#1f4d8c); color:#fff; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.top-bar .sys-name { font-size:15px; font-weight:700; }
.top-bar a { color:#bdd4f0; text-decoration:none; font-size:12px; }
.main { max-width:1100px; margin:0 auto; padding:14px; }
.card { background:#fff; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.05); padding:20px; }
.card h1 { font-size:clamp(16px,4vw,20px); color:#1a3a6b; margin-bottom:4px; }
.card .sub { font-size:12px; color:#999; margin-bottom:14px; }
.warn-banner { background:#fff8e1; border:2px solid #ff9800; padding:8px 14px; border-radius:6px; margin-bottom:12px; font-size:12px; color:#805b00; line-height:1.6; }
.warn-banner strong { color:#e65100; display:block; margin-bottom:2px; }
.search-bar { display:flex; gap:8px; margin-bottom:12px; }
.search-bar input { flex:1; padding:8px 12px; border:2px solid #e0e5ec; border-radius:6px; font-size:14px; }
.search-bar input:focus { border-color:#1a3a6b; outline:none; }
.search-bar button { padding:8px 16px; background:#1a3a6b; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
.search-bar button:hover { background:#152e56; }
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:12px; min-width:700px; }
th { background:#f0f3f7; padding:8px 6px; border-bottom:2px solid #d8dde5; text-align:center; color:#666; font-weight:500; white-space:nowrap; }
td { padding:6px; border-bottom:1px solid #eef0f2; text-align:center; }
tr:hover { background:#f5f7fa; }
.score { font-weight:700; color:#1a3a6b; }
.rank { color:#666; font-size:10px; }
.note-tag { display:inline-block; background:#ff9800; color:#fff; padding:1px 6px; border-radius:3px; font-size:10px; }
.footer { text-align:center; padding:16px; font-size:11px; color:#999; }
@media (max-width:768px) { .main { padding:8px; } .card { padding:12px; } .search-bar { flex-direction:column; } }
</style>
</head>
<body>
<div class="top-bar">
  <div class="sys-name">📈 历年录取参考</div>
  <a href="/">← 返回填报</a>
</div>
<div class="main">
<div class="warn-banner">
  <strong>⚠️ 全部为2025年模拟数据，非官方真实录取结果！</strong>
  真实录取最低分、平均分、位次请查阅陕西省教育考试院官网。模拟数据仅供理解"冲稳保"策略，切勿作为真实填报依据。
</div>

<div class="card">
  <h1>2025年高职（专科）批次录取参考（模拟数据）</h1>
  <div class="sub"><span style="color:#e65100;">⚠️ 非官方真实数据</span> | <span id="recordCount">加载中…</span></div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索院校名或代号…" onkeydown="if(event.key==='Enter')loadData()">
    <button onclick="loadData()">🔍</button>
    <button onclick="document.getElementById('searchInput').value='';loadData()" style="background:#fff;color:#1a3a6b;border:1px solid #d8dde5;">全部</button>
  </div>

  <div class="table-wrap">
  <table><thead><tr>
    <th>院校代号</th><th>院校名称</th><th>专业组</th><th>专业组名称</th>
    <th>最低分</th><th>平均分</th><th>最高分</th><th>最低位次</th><th>招生数</th><th>备注</th>
  </tr></thead>
  <tbody id="historyBody"><tr><td colspan="10" style="padding:20px;color:#999;">加载中…</td></tr></tbody></table>
  </div>
</div>
</div>
<div class="footer">以上全部为模拟数据 | 真实数据：<a href="https://www.sneea.cn" target="_blank" style="color:#1a3a6b;">陕西省教育考试院</a></div>

<script>
async function init() { try { const r = await fetch('/api/me'); if (!r.ok) location.href='/login.html'; } catch(e) { location.href='/login.html'; } await loadData(); }
async function loadData() {
  const kw = document.getElementById('searchInput').value.trim();
  let url='/api/history'; if(kw) url+='?keyword='+encodeURIComponent(kw);
  try {
    const r = await fetch(url); const d = await r.json();
    document.getElementById('recordCount').textContent=`共 ${d.length} 条（全部模拟数据）`;
    document.getElementById('historyBody').innerHTML = d.length ? d.map(row=>`<tr>
      <td><strong>${row.school_code}</strong></td><td style="text-align:left;">${row.school_name}</td>
      <td>${row.group_code}</td><td style="text-align:left;">${row.group_name||''}</td>
      <td class="score">${row.min_score}</td><td>${row.avg_score}</td><td>${row.max_score}</td>
      <td><span class="rank">${(row.min_rank||0).toLocaleString()}</span></td>
      <td>${row.plan_count||'-'}</td>
      <td><span class="note-tag">${row.note||'模拟数据'}</span></td>
    </tr>`).join('') : '<tr><td colspan="10" style="padding:20px;color:#999;">无结果</td></tr>';
  } catch(e) {}
}
window.addEventListener('load',init);
</script>
</body>
</html>
